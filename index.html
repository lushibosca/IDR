<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>IDR launcher | Inicio</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <link rel="manifest" href="./manifest.json">
    <script src="./shared/idr-tema.js"></script>
    <script src="./shared/idr-version.js"></script>
    <script src="./shared/ui/js/arranque.js" data-prefijo="IDR_" data-tema="light"></script>
    <!-- CSS por capas (@layer en tokens.css): tokens y base de la suite (./shared/ui) y, en la capa app, lo propio del launcher
         (styles.css). Sin esqueleto de pestañas: no las tiene. Sin !important. -->
    <link rel="stylesheet" href="./shared/ui/tokens.css">
    <link rel="stylesheet" href="./shared/ui/base.css">
    <link rel="stylesheet" href="./shared/idr-actualizacion.css">
    <link rel="stylesheet" href="./shared/ui/fondo.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./shared/ui/utilidades.css">
    <link rel="stylesheet" href="./shared/vendor/fonts/inter.css">
</head>

<body>
    <div class="bg-backdrop" aria-hidden="true">
        <div class="bg-layer bg-light"></div>
        <div class="bg-layer bg-dark"></div>
        <div class="bg-overlay"></div>
    </div>

    <header class="header">
        <div class="header-logo"><i class="bi bi-grid-1x2" aria-hidden="true"></i></div>
        <h1 class="header-main-title">IDR</h1>
        <div class="header-actions">
            <button type="button" class="icon-btn" id="btn-install-app" title="Instalar Aplicación" aria-label="Instalar la aplicación" hidden>
                <i class="bi bi-download" aria-hidden="true"></i>
            </button>
            <button type="button" class="icon-btn" id="btn-dark-mode" data-idr-tema-alternar title="Activar modo oscuro" aria-label="Alternar modo oscuro">
                <i class="bi bi-moon-fill" id="icono-tema" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <div class="app-grid">
            <!-- SGC (CCTV estático) -->
            <a href="./SGC/index.html" class="app-card card-green" rel="noopener noreferrer">
                <div class="app-icon-wrapper"><i class="bi bi-camera-video app-icon" aria-hidden="true"></i></div>
                <div class="app-info">
                    <h3>CCTV</h3>
                    <p>Stock y producción de cámaras, con sincronización cifrada.</p>
                </div>
            </a>

            <!-- SGI (Materiales) -->
            <a href="./SGI/index.html" class="app-card card-blue" rel="noopener noreferrer">
                <div class="app-icon-wrapper"><i class="bi bi-box-seam app-icon" aria-hidden="true"></i></div>
                <div class="app-info">
                    <h3>Materiales</h3>
                    <p>Gestión de Entradas y salidas de materiales</p>
                </div>
            </a>

            <!-- SGR (Racks) -->
            <a href="./SGR/index.html" class="app-card card-red" rel="noopener noreferrer">
                <div class="app-icon-wrapper"><i class="bi bi-hdd-rack app-icon" aria-hidden="true"></i></div>
                <div class="app-info">
                    <h3>Racks</h3>
                    <p>Ubicaciones de racks de telecomunicaciones.</p>
                </div>
            </a>

            <!-- SGP (Patcheras) -->
            <a href="./SGP/index.html" class="app-card card-orange" rel="noopener noreferrer">
                <div class="app-icon-wrapper"><i class="bi bi-plug app-icon" aria-hidden="true"></i></div>
                <div class="app-info">
                    <h3>Patcheras</h3>
                    <p>Documentación de bocas de red en los racks.</p>
                </div>
            </a>

            <!-- SGM (Planos): todavía no existe -->
            <a href="./SGM/index.html" class="app-card card-purple disabled" rel="noopener noreferrer" aria-disabled="true" tabindex="-1">
                <div class="app-icon-wrapper"><i class="bi bi-map app-icon" aria-hidden="true"></i></div>
                <div class="app-info">
                    <h3>Planos</h3>
                    <p>Documentación de instalación de puestos en planos.</p>
                </div>
            </a>
        </div>
    </main>
    <footer class="footer">
        <div class="app-version" data-idr-version="IDR" title="Versión de la suite IDR (la misma en todas las apps)"></div>
    </footer>

    <script src="./shared/ui/js/instalar.js"></script>
    <script src="./shared/idr-actualizacion.js" data-sw="./sw.js" data-scope="./"></script>
    <script src="./shared/ui/js/apariencia.js"></script>
    <script src="./app.js"></script>
</body>

</html>
